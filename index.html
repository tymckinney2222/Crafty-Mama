<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#c4956a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Crafty Mama">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Crafty Mama — Small Business Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@400;500;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f0eb; --bg2: #ede5da; --card: #fff; --card-hover: #faf7f3; --sidebar-bg: #3d2e1f; --sidebar-text: #c4b69a; --sidebar-active: #c4956a;
  --text: #3d2e1f; --text2: #6b5c4e; --text3: #8b7355; --text4: #a0937e;
  --accent: #c4956a; --accent2: #a07850; --border: #ddd5ca; --border2: #ede8e1; --border3: #f0ebe4;
  --green: #059669; --red: #dc2626; --amber: #d97706; --blue: #3b82f6;
  --input-bg: #faf7f3; --shadow: 0 1px 4px rgba(0,0,0,0.06); --shadow2: 0 4px 12px rgba(0,0,0,0.1);
}
[data-theme="dark"] {
  --bg: #141210; --bg2: #1c1916; --card: #242019; --card-hover: #2e2a22; --sidebar-bg: #1c1916;
  --text: #e8e0d8; --text2: #bfb5a8; --text3: #8b7355; --text4: #6b5c4e;
  --border: #3d3528; --border2: #332d24; --border3: #2a2520;
  --input-bg: #2a2520; --shadow: 0 1px 4px rgba(0,0,0,0.2); --shadow2: 0 4px 12px rgba(0,0,0,0.3);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
input, select, textarea, button { font-family: 'DM Sans', sans-serif; color: var(--text); }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
@keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
@keyframes modalIn { from { opacity:0; transform:scale(0.95); } to { opacity:1; transform:scale(1); } }
@keyframes slideIn { from { opacity:0; transform:translateX(-10px); } to { opacity:1; transform:translateX(0); } }
@keyframes confettiDrop { 0% { transform:translateY(-20px) rotate(0deg); opacity:1; } 100% { transform:translateY(100vh) rotate(720deg); opacity:0; } }
@keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.05); } }

/* ── Sidebar ── */
.cm-sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 220px; background: var(--sidebar-bg); display: flex; flex-direction: column; z-index: 100; transition: transform 0.3s ease; }
.cm-sidebar-brand { padding: 20px 16px 18px; border-bottom: 1px solid rgba(255,255,255,0.1); text-align: center; }
.cm-sidebar-logo { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700; color: #f5f0eb; }
.cm-sidebar-tag { font-size: 11px; color: var(--sidebar-text); letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }
.cm-brand-logo { display: inline-block; }
.cm-brand-logo svg { width: 160px; height: 160px; }
.cm-brand-logo-sm svg { width: 36px; height: 36px; }
.cm-brand-logo-inv svg { width: 120px; height: 120px; }
.cm-sidebar-nav { flex: 1; padding: 12px 0; overflow-y: auto; }
.cm-nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 20px; color: var(--sidebar-text); font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; border-left: 3px solid transparent; text-decoration: none; position: relative; }
.cm-nav-item:hover { background: rgba(255,255,255,0.05); color: #f5f0eb; }
.cm-nav-item.active { background: rgba(196,149,106,0.15); color: #f5f0eb; border-left-color: var(--accent); }
.cm-nav-item .nav-icon { font-size: 18px; width: 24px; text-align: center; }
.cm-nav-badge { background: var(--accent); color: #fff; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 8px; margin-left: auto; }
.cm-sidebar-footer { padding: 16px 20px; border-top: 1px solid rgba(255,255,255,0.1); }
.cm-dark-toggle { display: flex; align-items: center; gap: 10px; color: var(--sidebar-text); font-size: 13px; cursor: pointer; padding: 8px 0; }
.cm-toggle-track { width: 40px; height: 22px; border-radius: 11px; background: rgba(255,255,255,0.15); position: relative; transition: background 0.3s; flex-shrink: 0; }
.cm-toggle-thumb { width: 18px; height: 18px; border-radius: 50%; background: #fff; position: absolute; top: 2px; left: 2px; transition: transform 0.3s; }
[data-theme="dark"] .cm-toggle-thumb { transform: translateX(18px); }
[data-theme="dark"] .cm-toggle-track { background: var(--accent); }

/* ── Main Content ── */
.cm-app { margin-left: 220px; min-height: 100vh; transition: margin-left 0.3s; }
.cm-topbar { display: none; }
.cm-main { max-width: 1000px; margin: 0 auto; padding: 24px 28px 100px; }
.cm-page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.cm-page-title { font-family: 'Playfair Display', serif; font-size: 24px; color: var(--text); }
.cm-add-btn { background: var(--accent); color: #fff; border: none; padding: 10px 20px; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; box-shadow: 0 2px 8px rgba(196,149,106,0.3); transition: all 0.2s; }
.cm-add-btn:hover { background: var(--accent2); transform: translateY(-1px); }

/* ── Bottom Nav (Mobile) ── */
.cm-bottom-nav { display: none; }

/* ── Tab Content ── */
.cm-tab-content { display: none; }
.cm-tab-content.active { display: block; animation: fadeIn 0.35s ease; }

/* ── Cards & Components ── */
.cm-filter-bar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
.cm-filter-group { display: flex; gap: 4px; flex-wrap: wrap; }
.cm-filter-btn { background: var(--card); border: 1px solid var(--border); padding: 6px 14px; border-radius: 20px; font-size: 13px; color: var(--text2); cursor: pointer; transition: all 0.2s; }
.cm-filter-btn:hover { border-color: var(--accent); }
.cm-filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.cm-search-input { padding: 8px 14px; border-radius: 10px; border: 1px solid var(--border); font-size: 14px; background: var(--card); margin-left: auto; width: 220px; color: var(--text); }
.cm-select { padding: 8px 14px; border-radius: 10px; border: 1px solid var(--border); font-size: 14px; background: var(--card); cursor: pointer; color: var(--text); }
.cm-card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.cm-card { background: var(--card); border-radius: 14px; padding: 18px; box-shadow: var(--shadow); transition: all 0.25s; animation: fadeIn 0.3s ease both; }
.cm-card:hover { box-shadow: var(--shadow2); transform: translateY(-2px); }
.cm-card:nth-child(1) { animation-delay: 0s; } .cm-card:nth-child(2) { animation-delay: 0.05s; } .cm-card:nth-child(3) { animation-delay: 0.1s; }
.cm-card:nth-child(4) { animation-delay: 0.15s; } .cm-card:nth-child(5) { animation-delay: 0.2s; } .cm-card:nth-child(6) { animation-delay: 0.25s; }
.cm-order-card { border-left: 4px solid #ccc; }
.cm-order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.cm-status-badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
.cm-status-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.cm-urgent-badge { font-size: 11px; font-weight: 700; color: var(--red); background: #fee2e2; padding: 2px 8px; border-radius: 10px; animation: pulse 2s infinite; }
.cm-soon-badge { font-size: 11px; font-weight: 700; color: var(--amber); background: #fef3c7; padding: 2px 8px; border-radius: 10px; }
.cm-order-customer { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--text); margin-bottom: 4px; }
.cm-order-items { font-size: 14px; color: var(--text2); margin-bottom: 10px; line-height: 1.4; }
.cm-order-meta { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.cm-meta-item { font-size: 13px; color: var(--text3); }
.cm-order-notes { font-size: 13px; color: var(--text4); font-style: italic; margin-bottom: 8px; }
.cm-order-actions { display: flex; gap: 8px; align-items: center; padding-top: 10px; border-top: 1px solid var(--border3); flex-wrap: wrap; }
.cm-advance-btn { background: linear-gradient(135deg, #8fbc8f, #6b9e6b); color: #fff; border: none; padding: 6px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.cm-advance-btn:hover { transform: scale(1.03); }
.cm-reorder-btn { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border: none; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
.cm-edit-btn { background: var(--card); border: 1px solid var(--border); padding: 6px 14px; border-radius: 8px; font-size: 13px; color: var(--text2); cursor: pointer; transition: all 0.2s; }
.cm-edit-btn:hover { border-color: var(--accent); color: var(--accent); }
.cm-delete-btn { background: none; border: none; color: var(--text4); font-size: 16px; cursor: pointer; margin-left: auto; padding: 4px 8px; transition: color 0.2s; }
.cm-delete-btn:hover { color: var(--red); }
.cm-expense-total { font-size: 18px; margin-bottom: 12px; color: var(--text); font-family: 'Playfair Display', serif; }
.cm-table-wrap { overflow-x: auto; border-radius: 14px; border: 1px solid var(--border); background: var(--card); }
.cm-table { width: 100%; border-collapse: collapse; }
.cm-table th { text-align: left; padding: 10px 14px; font-size: 12px; font-weight: 600; color: var(--text3); text-transform: uppercase; border-bottom: 2px solid var(--border2); background: var(--input-bg); }
.cm-table td { padding: 10px 14px; font-size: 14px; color: var(--text); border-bottom: 1px solid var(--border3); }
.cm-table tr:hover td { background: var(--card-hover); }
.cm-cat-pill { display: inline-block; background: var(--border2); color: var(--text2); padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; }
.cm-edit-sm { background: none; border: none; cursor: pointer; font-size: 14px; padding: 2px 6px; }
.cm-delete-sm { background: none; border: none; cursor: pointer; font-size: 14px; padding: 2px 6px; color: var(--text4); }
.cm-stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
.cm-stat-card { background: var(--card); border-radius: 14px; padding: 18px; text-align: center; box-shadow: var(--shadow); transition: transform 0.2s; }
.cm-stat-card:hover { transform: translateY(-3px); }
.cm-stat-icon { font-size: 28px; }
.cm-stat-label { font-size: 13px; color: var(--text3); margin-top: 4px; }
.cm-stat-value { font-size: 26px; font-weight: 700; font-family: 'Playfair Display', serif; }
.cm-stat-sub { font-size: 12px; color: var(--text4); }
.cm-dash-section { background: var(--card); border-radius: 14px; padding: 20px; box-shadow: var(--shadow); margin-bottom: 16px; }
.cm-section-title { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--text); margin-bottom: 14px; }
.cm-dash-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.cm-pipeline-bar { display: flex; gap: 3px; border-radius: 10px; overflow: hidden; height: 36px; }
.cm-pipeline-seg { display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 600; min-width: 40px; transition: width 0.5s ease; }
.cm-pipeline-legend { display: flex; gap: 16px; margin-top: 8px; flex-wrap: wrap; }
.cm-legend-item { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--text2); }
.cm-legend-dot { width: 10px; height: 10px; border-radius: 50%; }
.cm-chart-row { display: flex; gap: 8px; align-items: flex-end; height: 140px; }
.cm-chart-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.cm-chart-bars { width: 100%; display: flex; gap: 3px; align-items: flex-end; height: 110px; }
.cm-chart-bar { flex: 1; border-radius: 6px 6px 0 0; transition: height 0.5s ease; }
.cm-chart-label { font-size: 11px; color: var(--text3); }
.cm-chart-legend { display: flex; gap: 16px; margin-top: 8px; justify-content: center; }
.cm-chart-legend-item { font-size: 12px; color: var(--text2); display: flex; align-items: center; gap: 4px; }
.cm-chart-legend-swatch { width: 12px; height: 8px; border-radius: 3px; }
.cm-exp-bar-wrap { display: flex; flex-direction: column; gap: 10px; }
.cm-exp-bar-header { display: flex; justify-content: space-between; font-size: 13px; color: var(--text2); margin-bottom: 3px; }
.cm-exp-bar-track { height: 10px; background: var(--border2); border-radius: 5px; overflow: hidden; }
.cm-exp-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 5px; transition: width 0.5s ease; }
.cm-top-items { display: flex; gap: 8px; flex-wrap: wrap; }
.cm-top-pill { display: inline-block; padding: 6px 14px; border-radius: 12px; font-size: 14px; font-weight: 500; }
.cm-top-pill:first-child { background: var(--accent); color: #fff; }
.cm-top-pill:not(:first-child) { background: var(--border2); color: var(--text2); }
.cm-insights { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.cm-insight { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 12px; font-size: 13px; color: var(--text); background: var(--card); border: 1px solid var(--border2); flex: 1; min-width: 240px; line-height: 1.4; transition: transform 0.2s; }
.cm-insight:hover { transform: translateY(-2px); }
.cm-insight strong { color: var(--accent); }
.cm-product-header { display: flex; justify-content: space-between; align-items: flex-start; }
.cm-product-name { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--text); margin-top: 6px; }
.cm-product-price { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700; color: var(--green); }
.cm-product-desc { font-size: 14px; color: var(--text2); margin-top: 8px; line-height: 1.5; }
.cm-product-actions { display: flex; gap: 8px; margin-top: 12px; }
.cm-empty { text-align: center; padding: 60px 20px; }
.cm-empty-icon { font-size: 48px; margin-bottom: 12px; }
.cm-empty-text { color: var(--text3); font-size: 15px; }
.cm-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px; backdrop-filter: blur(6px); }
.cm-modal { background: var(--card); border-radius: 18px; padding: 28px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; animation: modalIn 0.25s ease; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
.cm-form-title { font-family: 'Playfair Display', serif; font-size: 22px; color: var(--text); margin-bottom: 20px; }
.cm-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.cm-form-label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 500; color: var(--text2); }
.cm-form-label.full { grid-column: 1 / -1; }
.cm-form-input { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); font-size: 14px; background: var(--input-bg); color: var(--text); transition: border-color 0.2s; }
.cm-form-input:focus { border-color: var(--accent); }
textarea.cm-form-input { height: 60px; resize: vertical; }
.cm-form-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px; }
.cm-cancel-btn { background: var(--card); border: 1px solid var(--border); padding: 10px 20px; border-radius: 10px; font-size: 14px; color: var(--text2); cursor: pointer; transition: all 0.2s; }
.cm-cancel-btn:hover { border-color: var(--accent); }
.cm-save-btn { background: var(--accent); color: #fff; border: none; padding: 10px 24px; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.2s; }
.cm-save-btn:hover { background: var(--accent2); transform: translateY(-1px); }
.cm-save-btn:disabled { opacity: 0.5; }
.cm-danger-btn { background: var(--red); color: #fff; border: none; padding: 10px 24px; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; }
.cm-quick-pills { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
.cm-quick-pill { background: var(--border2); border: 1px solid var(--border); padding: 3px 10px; border-radius: 10px; font-size: 12px; color: var(--text3); cursor: pointer; transition: all 0.2s; }
.cm-quick-pill:hover { border-color: var(--accent); color: var(--accent); }
.cm-confirm { text-align: center; padding: 8px; }
.cm-confirm-actions { display: flex; gap: 12px; justify-content: center; }
.cm-quick-add { display: flex; gap: 8px; align-items: center; background: var(--card); border-radius: 14px; padding: 12px 16px; box-shadow: var(--shadow); margin-bottom: 16px; flex-wrap: wrap; }
.cm-quick-add input, .cm-quick-add select { padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border); font-size: 14px; background: var(--input-bg); color: var(--text); }
.cm-quick-add input.qa-desc { flex: 2; min-width: 140px; }
.cm-quick-add input.qa-amt { width: 100px; }
.cm-qa-btn { background: var(--accent); color: #fff; border: none; width: 38px; height: 38px; border-radius: 10px; font-size: 20px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
.cm-qa-btn:hover { transform: scale(1.08); }
.cm-week-banner { background: var(--card); border-radius: 14px; padding: 14px 18px; box-shadow: var(--shadow); margin-bottom: 16px; border-left: 4px solid var(--accent); animation: slideIn 0.3s ease; }
.cm-week-banner-title { font-family: 'Playfair Display', serif; font-size: 16px; color: var(--text); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.cm-week-banner-title .count { background: var(--accent); color: #fff; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 10px; }
.cm-week-items { display: flex; gap: 8px; flex-wrap: wrap; }
.cm-week-chip { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 10px; font-size: 13px; background: var(--input-bg); border: 1px solid var(--border2); cursor: pointer; transition: all 0.2s; }
.cm-week-chip:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.cm-week-chip .chip-dot { width: 8px; height: 8px; border-radius: 50%; }
.cm-week-chip .chip-name { font-weight: 600; color: var(--text); }
.cm-week-chip .chip-date { color: var(--text3); font-size: 12px; }
.cm-week-chip.overdue { border-color: #fca5a5; background: #fef2f2; }
.cm-week-chip.today-chip { border-color: var(--accent); background: #fef9f3; }
[data-theme="dark"] .cm-week-chip.overdue { background: #3b1515; border-color: #7f1d1d; }
[data-theme="dark"] .cm-week-chip.today-chip { background: #2a2015; border-color: var(--accent); }
.cm-cust-card { background: var(--card); border-radius: 14px; padding: 18px; box-shadow: var(--shadow); cursor: pointer; transition: all 0.25s; }
.cm-cust-card:hover { box-shadow: var(--shadow2); transform: translateY(-2px); }
.cm-cust-avatar { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; color: #fff; flex-shrink: 0; }
.cm-cust-header { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.cm-cust-name { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--text); }
.cm-cust-repeat { background: #d1fae5; color: #065f46; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; margin-left: 8px; }
.cm-cust-stats { display: flex; gap: 16px; flex-wrap: wrap; }
.cm-cust-stat { font-size: 13px; color: var(--text2); }
.cm-cust-stat strong { color: var(--text); }
.cm-cust-history { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border3); }
.cm-cust-hist-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; border-radius: 8px; font-size: 13px; cursor: pointer; margin-bottom: 2px; transition: background 0.15s; }
.cm-cust-hist-row:hover { background: var(--card-hover); }
.cm-cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
.cm-cal-title { font-family: 'Playfair Display', serif; font-size: 22px; color: var(--text); }
.cm-cal-nav { display: flex; gap: 8px; align-items: center; }
.cm-cal-nav-btn { background: var(--card); border: 1px solid var(--border); width: 38px; height: 38px; border-radius: 10px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text2); transition: all 0.2s; }
.cm-cal-nav-btn:hover { border-color: var(--accent); color: var(--accent); }
.cm-cal-today-btn { background: var(--accent); color: #fff; border: none; padding: 6px 14px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; }
.cm-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: var(--border); border-radius: 14px; overflow: hidden; }
.cm-cal-dow { background: var(--sidebar-bg); color: #f5f0eb; text-align: center; padding: 10px 4px; font-size: 12px; font-weight: 600; text-transform: uppercase; }
.cm-cal-day { background: var(--card); min-height: 100px; padding: 6px; display: flex; flex-direction: column; transition: background 0.15s; }
.cm-cal-day:hover { background: var(--card-hover); }
.cm-cal-day.other-month { background: var(--bg2); }
.cm-cal-day.other-month .cm-cal-daynum { color: var(--text4); }
.cm-cal-day.today { box-shadow: inset 0 0 0 2px var(--accent); }
.cm-cal-daynum { font-size: 13px; font-weight: 600; color: var(--text2); margin-bottom: 4px; padding: 2px 6px; align-self: flex-end; }
.cm-cal-day.today .cm-cal-daynum { background: var(--accent); color: #fff; border-radius: 12px; }
.cm-cal-events { display: flex; flex-direction: column; gap: 2px; flex: 1; overflow-y: auto; }
.cm-cal-event { font-size: 11px; padding: 3px 6px; border-radius: 5px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; transition: filter 0.15s; }
.cm-cal-event:hover { filter: brightness(0.9); }
.cm-cal-more { font-size: 10px; color: var(--text3); font-weight: 600; padding: 1px 6px; cursor: pointer; }
.cm-cal-legend { display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap; justify-content: center; }
.cm-cal-legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text2); }
.cm-cal-legend-dot { width: 10px; height: 10px; border-radius: 4px; }
.cm-cal-popover { position: fixed; z-index: 999; background: var(--card); border-radius: 14px; padding: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.2); min-width: 240px; max-width: 320px; animation: modalIn 0.15s ease; }
.cm-cal-popover-title { font-family: 'Playfair Display', serif; font-size: 16px; color: var(--text); margin-bottom: 10px; }
.cm-cal-popover-item { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border3); cursor: pointer; }
.cm-cal-popover-item:last-child { border-bottom: none; }
.cm-invoice { font-family: 'DM Sans', sans-serif; }
.cm-inv-header { text-align: center; padding-bottom: 16px; border-bottom: 2px solid var(--accent); margin-bottom: 16px; }
.cm-inv-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; }
.cm-inv-total { border-top: 2px solid var(--text); margin-top: 12px; padding-top: 12px; font-size: 18px; font-weight: 700; }
.cm-calc-result { background: #d1fae5; border-radius: 12px; padding: 16px; text-align: center; margin-top: 16px; }
[data-theme="dark"] .cm-calc-result { background: #0a3320; }
.cm-calc-price { font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 700; color: var(--green); }
.cm-photo-thumb { width: 60px; height: 60px; border-radius: 10px; object-fit: cover; cursor: pointer; border: 1px solid var(--border); }
.cm-photo-full { max-width: 100%; max-height: 70vh; border-radius: 14px; }
.cm-photo-upload { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.cm-photo-upload label { background: var(--border2); border: 1px solid var(--border); padding: 6px 14px; border-radius: 10px; font-size: 13px; color: var(--text2); cursor: pointer; }
.cm-order-photo { margin: 8px 0; }
.cm-tools-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
.cm-tool-card { background: var(--card); border-radius: 14px; padding: 24px; box-shadow: var(--shadow); text-align: center; cursor: pointer; transition: all 0.25s; }
.cm-tool-card:hover { box-shadow: var(--shadow2); transform: translateY(-3px); }
.cm-tool-icon { font-size: 36px; margin-bottom: 10px; }
.cm-tool-title { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--text); margin-bottom: 6px; }
.cm-tool-desc { font-size: 13px; color: var(--text3); line-height: 1.4; }

/* Confetti */
.confetti-piece { position: fixed; top: -20px; width: 10px; height: 10px; z-index: 9999; pointer-events: none; animation: confettiDrop 2.5s ease-in forwards; }

/* Mobile */
@media (max-width: 768px) {
  .cm-sidebar { transform: translateX(-100%); }
  .cm-sidebar.open { transform: translateX(0); box-shadow: 4px 0 20px rgba(0,0,0,0.3); }
  .cm-app { margin-left: 0; }
  .cm-topbar { display: flex; align-items: center; gap: 12px; padding: 14px 20px; background: var(--sidebar-bg); border-bottom: 3px solid var(--accent); position: sticky; top: 0; z-index: 50; }
  .cm-hamburger { background: none; border: none; color: #f5f0eb; font-size: 24px; cursor: pointer; padding: 4px; }
  .cm-topbar-brand { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700; color: #f5f0eb; flex: 1; display: flex; align-items: center; gap: 8px; }
  .cm-topbar .cm-add-btn { padding: 8px 14px; font-size: 13px; border-radius: 8px; }
  .cm-bottom-nav { display: flex; position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); z-index: 50; padding: 6px 0 env(safe-area-inset-bottom, 6px); box-shadow: 0 -2px 12px rgba(0,0,0,0.08); }
  .cm-bottom-nav .bnav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px; font-size: 10px; color: var(--text3); cursor: pointer; transition: color 0.2s; border: none; background: none; position: relative; }
  .cm-bottom-nav .bnav-item.active { color: var(--accent); }
  .cm-bottom-nav .bnav-item.active::after { content: ''; position: absolute; top: 0; left: 25%; right: 25%; height: 3px; background: var(--accent); border-radius: 0 0 3px 3px; }
  .cm-bottom-nav .bnav-icon { font-size: 20px; }
  .cm-main { padding: 16px 16px 100px; }
  .cm-stat-grid { grid-template-columns: 1fr 1fr; }
  .cm-dash-row { grid-template-columns: 1fr; }
  .cm-card-grid { grid-template-columns: 1fr; }
  .cm-cal-day { min-height: 70px; }
  .cm-search-input { width: 100%; margin-left: 0; }
  .cm-form-grid { grid-template-columns: 1fr; }
  .cm-form-label.full { grid-column: 1; }
  .cm-page-header { flex-wrap: wrap; gap: 8px; }
  .cm-sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 99; display: none; }
  .cm-sidebar-overlay.open { display: block; }
}
</style>
</head>
<body>

<!-- Sidebar -->
<aside class="cm-sidebar" id="sidebar">
  <div class="cm-sidebar-brand">
    <div class="cm-brand-logo" id="sidebarLogo"></div>
  </div>
  <nav class="cm-sidebar-nav" id="sideNav">
    <div class="cm-nav-item active" data-tab="orders"><span class="nav-icon">📋</span>Orders<span class="cm-nav-badge" id="ordersBadge">0</span></div>
    <div class="cm-nav-item" data-tab="expenses"><span class="nav-icon">💰</span>Expenses</div>
    <div class="cm-nav-item" data-tab="dashboard"><span class="nav-icon">📊</span>Dashboard</div>
    <div class="cm-nav-item" data-tab="calendar"><span class="nav-icon">📅</span>Calendar</div>
    <div class="cm-nav-item" data-tab="customers"><span class="nav-icon">👥</span>Customers</div>
    <div class="cm-nav-item" data-tab="products"><span class="nav-icon">🏷️</span>Products<span class="cm-nav-badge" id="productsBadge">0</span></div>
    <div class="cm-nav-item" data-tab="tools"><span class="nav-icon">🔧</span>Tools</div>
    <div class="cm-nav-item" onclick="openUserGuide()" style="margin-top:8px;border-top:1px solid rgba(255,255,255,0.08);padding-top:16px"><span class="nav-icon">📖</span>User Guide</div>
  </nav>
  <div class="cm-sidebar-footer">
    <div class="cm-dark-toggle" id="darkToggle">
      <div class="cm-toggle-track"><div class="cm-toggle-thumb"></div></div>
      <span id="themeLabel">Dark Mode</span>
    </div>
  </div>
</aside>
<div class="cm-sidebar-overlay" id="sidebarOverlay"></div>

<!-- Main App -->
<div class="cm-app">
  <!-- Mobile Top Bar -->
  <div class="cm-topbar">
    <button class="cm-hamburger" id="menuBtn">☰</button>
    <span class="cm-topbar-brand"><span class="cm-brand-logo-sm" id="topLogo"></span> Crafty Mama</span>
    <button class="cm-add-btn" id="headerAddBtn">+ New</button>
  </div>

  <main class="cm-main">
    <div id="weekBanner"></div>
    <div class="cm-page-header"><h1 class="cm-page-title" id="pageTitle">📋 Orders</h1><button class="cm-add-btn" id="desktopAddBtn" style="display:none">+ New Order</button></div>

    <div class="cm-tab-content active" id="tab-orders"><div class="cm-filter-bar"><div class="cm-filter-group" id="orderFilters"></div><input class="cm-search-input" id="orderSearch" placeholder="Search customers or items..."></div><div id="ordersContent"></div></div>
    <div class="cm-tab-content" id="tab-expenses"><div class="cm-quick-add"><input class="cm-form-input qa-desc" id="qa-desc" placeholder="Description..."/><input class="cm-form-input qa-amt" id="qa-amt" type="number" step="0.01" min="0" placeholder="$0.00"/><select class="cm-form-input" id="qa-cat"></select><button class="cm-qa-btn" id="qa-submit">+</button></div><div class="cm-filter-bar"><div class="cm-filter-group" id="expCatFilters"></div><select class="cm-select" id="expMonthFilter"><option value="All">All Months</option></select></div><div class="cm-expense-total" id="expTotal"></div><div id="expensesContent"></div></div>
    <div class="cm-tab-content" id="tab-dashboard"><div id="dashboardContent"></div></div>
    <div class="cm-tab-content" id="tab-calendar"><div id="calendarContent"></div></div>
    <div class="cm-tab-content" id="tab-customers"><div class="cm-filter-bar"><input class="cm-search-input" id="custSearch" placeholder="Search customers..." style="margin-left:0"><div class="cm-filter-group" id="custSortBtns"></div></div><div id="customersContent"></div></div>
    <div class="cm-tab-content" id="tab-products"><div class="cm-filter-bar"><div class="cm-filter-group" id="prodCatFilters"></div></div><div id="productsContent"></div></div>
    <div class="cm-tab-content" id="tab-tools"><div id="toolsContent"></div></div>
  </main>
</div>

<!-- Bottom Nav (Mobile) -->
<nav class="cm-bottom-nav" id="bottomNav">
  <button class="bnav-item active" data-tab="orders"><span class="bnav-icon">📋</span>Orders</button>
  <button class="bnav-item" data-tab="expenses"><span class="bnav-icon">💰</span>Expenses</button>
  <button class="bnav-item" data-tab="dashboard"><span class="bnav-icon">📊</span>Dashboard</button>
  <button class="bnav-item" data-tab="calendar"><span class="bnav-icon">📅</span>Calendar</button>
  <button class="bnav-item" data-tab="customers"><span class="bnav-icon">👥</span>Customers</button>
</nav>

<div class="cm-overlay" id="modalOverlay" style="display:none;" onclick="if(event.target===this)closeModal();"><div class="cm-modal" id="modalBody"></div></div>

<script>
const KEYS={orders:'cm-orders',expenses:'cm-expenses',products:'cm-products'},STATUS_FLOW=['Pending','In Progress','Complete','Delivered'],STATUS_COLORS={'Pending':{bg:'#fef3c7',text:'#92400e',dot:'#f59e0b'},'In Progress':{bg:'#dbeafe',text:'#1e40af',dot:'#3b82f6'},'Complete':{bg:'#d1fae5',text:'#065f46',dot:'#10b981'},'Delivered':{bg:'#e8e0d8',text:'#5c4a3a',dot:'#8b7355'}},EXPENSE_CATS=['Ingredients','Supplies','Packaging','Shipping','Marketing','Other'],PRODUCT_CATS=['Baked Goods','Crafts','Custom','Seasonal','Other'],AVATAR_COLORS=['#c4956a','#8fbc8f','#6b9e6b','#3b82f6','#a07850','#d97706','#059669','#dc2626','#6366f1','#0891b2'];
let S={orders:[],expenses:[],products:[],activeTab:'orders',orderFilter:'Active',orderSearch:'',expCatFilter:'All',expMonthFilter:'All',prodCatFilter:'All',calMonth:new Date().getMonth(),calYear:new Date().getFullYear(),custSearch:'',custSort:'recent',custExpanded:null};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),fmt$=n=>'$'+Number(n||0).toFixed(2),fmtDate=d=>{if(!d)return'—';return new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})},todayStr=()=>new Date().toISOString().slice(0,10),daysUntil=d=>{if(!d)return Infinity;return Math.ceil((new Date(d+'T12:00:00')-new Date(todayStr()+'T12:00:00'))/86400000)},monthKey=d=>d?d.slice(0,7):todayStr().slice(0,7),esc=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML};
async function loadAll(){for(const[k,key]of Object.entries(KEYS)){try{const r=localStorage.getItem(key);S[k]=r?JSON.parse(r):[];}catch{S[k]=[];}}}
async function save(k){try{localStorage.setItem(KEYS[k],JSON.stringify(S[k]));}catch(e){console.error(e);}}

/* ── Navigation ── */
const TAB_TITLES={orders:'📋 Orders',expenses:'💰 Expenses',dashboard:'📊 Dashboard',calendar:'📅 Calendar',customers:'👥 Customers',products:'🏷️ Products',tools:'🔧 Tools'};
const TAB_ADD={orders:'Order',expenses:'Expense',products:'Product'};

function switchTab(t){
  S.activeTab=t;
  document.querySelectorAll('.cm-nav-item').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
  document.querySelectorAll('.bnav-item').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
  document.querySelectorAll('.cm-tab-content').forEach(c=>c.classList.toggle('active',c.id==='tab-'+t));
  document.getElementById('pageTitle').textContent=TAB_TITLES[t]||t;
  const addLabel=TAB_ADD[t];
  document.getElementById('desktopAddBtn').style.display=addLabel?'':'none';
  document.getElementById('desktopAddBtn').textContent=addLabel?'+ New '+addLabel:'';
  document.getElementById('headerAddBtn').style.display=addLabel?'':'none';
  document.getElementById('headerAddBtn').textContent=addLabel?'+ New':'';
  closeSidebar();
  render();
}

// Sidebar nav
document.getElementById('sideNav').addEventListener('click',e=>{const n=e.target.closest('.cm-nav-item');if(n)switchTab(n.dataset.tab);});
// Bottom nav
document.getElementById('bottomNav').addEventListener('click',e=>{const n=e.target.closest('.bnav-item');if(n)switchTab(n.dataset.tab);});
// Add buttons
document.getElementById('headerAddBtn').addEventListener('click',()=>{const t=S.activeTab==='expenses'?'expense':S.activeTab==='products'?'product':'order';openFormModal(t,null);});
document.getElementById('desktopAddBtn').addEventListener('click',()=>{const t=S.activeTab==='expenses'?'expense':S.activeTab==='products'?'product':'order';openFormModal(t,null);});

// Mobile sidebar
function openSidebar(){document.getElementById('sidebar').classList.add('open');document.getElementById('sidebarOverlay').classList.add('open');}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebarOverlay').classList.remove('open');}
document.getElementById('menuBtn').addEventListener('click',openSidebar);
document.getElementById('sidebarOverlay').addEventListener('click',closeSidebar);

// Dark mode
document.getElementById('darkToggle').addEventListener('click',()=>{
  const html=document.documentElement;const isDark=html.getAttribute('data-theme')==='dark';
  html.setAttribute('data-theme',isDark?'light':'dark');
  document.getElementById('themeLabel').textContent=isDark?'Dark Mode':'Light Mode';
  try{localStorage.setItem('cm-theme',isDark?'light':'dark');}catch{}
});
async function loadTheme(){try{const r=localStorage.getItem('cm-theme');if(r==='dark'){document.documentElement.setAttribute('data-theme','dark');document.getElementById('themeLabel').textContent='Light Mode';}}catch{}}

// Confetti
function fireConfetti(){const colors=['#f59e0b','#3b82f6','#10b981','#c4956a','#dc2626','#6366f1','#d97706','#059669'];for(let i=0;i<40;i++){const el=document.createElement('div');el.className='confetti-piece';el.style.left=Math.random()*100+'vw';el.style.background=colors[Math.floor(Math.random()*colors.length)];el.style.width=(6+Math.random()*8)+'px';el.style.height=(6+Math.random()*8)+'px';el.style.borderRadius=Math.random()>0.5?'50%':'2px';el.style.animationDuration=(2+Math.random()*1.5)+'s';el.style.animationDelay=(Math.random()*0.5)+'s';document.body.appendChild(el);setTimeout(()=>el.remove(),4000);}}

function openModal(h){document.getElementById('modalBody').innerHTML=h;document.getElementById('modalOverlay').style.display='flex';}
function closeModal(){document.getElementById('modalOverlay').style.display='none';}
function openConfirm(m,fn){openModal(`<div class="cm-confirm"><div style="font-size:40px;margin-bottom:12px">⚠️</div><p style="font-size:16px;color:var(--text);margin-bottom:20px">${esc(m)}</p><div class="cm-confirm-actions"><button class="cm-cancel-btn" onclick="closeModal()">Cancel</button><button class="cm-danger-btn" id="cY">Delete</button></div></div>`);document.getElementById('cY').onclick=()=>{fn();closeModal();};}
function openFormModal(t,d){if(t==='order')openOrderForm(d);else if(t==='expense')openExpenseForm(d);else openProductForm(d);}

function openOrderForm(data){const d=data||{id:uid(),customer:'',items:'',price:'',deposit:'',dueDate:'',status:'Pending',notes:'',created:todayStr()};const so=STATUS_FLOW.map(s=>`<option ${s===d.status?'selected':''}>${s}</option>`).join('');const qp=S.products.map(p=>`<button type="button" class="cm-quick-pill" data-pname="${esc(p.name)}">+ ${esc(p.name)}</button>`).join('');openModal(`<h2 class="cm-form-title">${data?'Edit Order':'New Order'}</h2><div class="cm-form-grid"><label class="cm-form-label">Customer *<input class="cm-form-input" id="f-c" value="${esc(d.customer)}" placeholder="Customer name"></label><label class="cm-form-label">Status<select class="cm-form-input" id="f-s">${so}</select></label><label class="cm-form-label full">Items<input class="cm-form-input" id="f-i" value="${esc(d.items)}" placeholder="e.g. Birthday cake, Wreath">${qp?'<div class="cm-quick-pills" id="qP">'+qp+'</div>':''}</label><label class="cm-form-label">Price *<input class="cm-form-input" id="f-p" type="number" step="0.01" min="0" value="${d.price}" placeholder="0.00"></label><label class="cm-form-label">Deposit<input class="cm-form-input" id="f-d" type="number" step="0.01" min="0" value="${d.deposit}" placeholder="0.00"></label><label class="cm-form-label">Due Date<input class="cm-form-input" id="f-dd" type="date" value="${d.dueDate}"></label><label class="cm-form-label full">Notes<textarea class="cm-form-input" id="f-n" placeholder="Special instructions...">${esc(d.notes||'')}</textarea></label><label class="cm-form-label full">Photo<div class="cm-photo-upload">${d.photo?`<img class="cm-photo-thumb" src="${d.photo}" id="f-preview">`:''}<label for="f-photo">📸 ${d.photo?'Change':'Add'} Photo</label><input type="file" id="f-photo" accept="image/*" style="display:none" onchange="handlePhotoUpload(this)"></div></label></div><div class="cm-form-actions"><button class="cm-cancel-btn" onclick="closeModal()">Cancel</button><button class="cm-save-btn" id="sO">${data?'Save Changes':'Add Order'}</button></div>`);const qpE=document.getElementById('qP');if(qpE)qpE.onclick=e=>{const b=e.target.closest('.cm-quick-pill');if(!b)return;const i=document.getElementById('f-i');i.value=i.value?i.value+', '+b.dataset.pname:b.dataset.pname;};document.getElementById('sO').onclick=()=>{const c=document.getElementById('f-c').value.trim(),p=document.getElementById('f-p').value;if(!c||!p)return;const o={id:d.id,customer:c,items:document.getElementById('f-i').value,price:p,deposit:document.getElementById('f-d').value||0,dueDate:document.getElementById('f-dd').value,status:document.getElementById('f-s').value,notes:document.getElementById('f-n').value,photo:window._pendingPhoto||d.photo||'',created:d.created||todayStr()};window._pendingPhoto=null;if(data)S.orders=S.orders.map(x=>x.id===o.id?o:x);else S.orders.unshift(o);save('orders');closeModal();render();};}
function openExpenseForm(data){const d=data||{id:uid(),description:'',amount:'',category:'Ingredients',date:todayStr()};const co=EXPENSE_CATS.map(c=>`<option ${c===d.category?'selected':''}>${c}</option>`).join('');openModal(`<h2 class="cm-form-title">${data?'Edit Expense':'New Expense'}</h2><div class="cm-form-grid"><label class="cm-form-label full">Description<input class="cm-form-input" id="f-ed" value="${esc(d.description)}" placeholder="What was this for?"></label><label class="cm-form-label">Amount *<input class="cm-form-input" id="f-ea" type="number" step="0.01" min="0" value="${d.amount}" placeholder="0.00"></label><label class="cm-form-label">Category<select class="cm-form-input" id="f-ec">${co}</select></label><label class="cm-form-label">Date<input class="cm-form-input" id="f-edt" type="date" value="${d.date}"></label></div><div class="cm-form-actions"><button class="cm-cancel-btn" onclick="closeModal()">Cancel</button><button class="cm-save-btn" id="sE">${data?'Save':'Add Expense'}</button></div>`);document.getElementById('sE').onclick=()=>{const a=document.getElementById('f-ea').value;if(!a)return;const o={id:d.id,description:document.getElementById('f-ed').value,amount:a,category:document.getElementById('f-ec').value,date:document.getElementById('f-edt').value||todayStr()};if(data)S.expenses=S.expenses.map(x=>x.id===o.id?o:x);else S.expenses.unshift(o);save('expenses');closeModal();render();};}
function openProductForm(data){const d=data||{id:uid(),name:'',basePrice:'',category:'Custom',description:''};const co=PRODUCT_CATS.map(c=>`<option ${c===d.category?'selected':''}>${c}</option>`).join('');openModal(`<h2 class="cm-form-title">${data?'Edit Product':'New Product'}</h2><div class="cm-form-grid"><label class="cm-form-label">Name *<input class="cm-form-input" id="f-pn" value="${esc(d.name)}" placeholder="Product name"></label><label class="cm-form-label">Price *<input class="cm-form-input" id="f-pp" type="number" step="0.01" min="0" value="${d.basePrice}" placeholder="0.00"></label><label class="cm-form-label">Category<select class="cm-form-input" id="f-pc">${co}</select></label><label class="cm-form-label full">Description<textarea class="cm-form-input" id="f-pd" placeholder="Details...">${esc(d.description||'')}</textarea></label></div><div class="cm-form-actions"><button class="cm-cancel-btn" onclick="closeModal()">Cancel</button><button class="cm-save-btn" id="sP">${data?'Save':'Add Product'}</button></div>`);document.getElementById('sP').onclick=()=>{const n=document.getElementById('f-pn').value.trim(),bp=document.getElementById('f-pp').value;if(!n||!bp)return;const o={id:d.id,name:n,basePrice:bp,category:document.getElementById('f-pc').value,description:document.getElementById('f-pd').value};if(data)S.products=S.products.map(x=>x.id===o.id?o:x);else S.products.unshift(o);save('products');closeModal();render();};}

function render(){renderBadges();renderWeekBanner();renderOrders();renderExpenses();renderDashboard();renderCalendar();renderCustomers();renderProducts();renderTools();}
function renderBadges(){const ob=S.orders.filter(o=>o.status!=='Delivered').length;document.getElementById('ordersBadge').textContent=ob;document.getElementById('productsBadge').textContent=S.products.length;}

function renderWeekBanner(){const b=document.getElementById('weekBanner'),td=todayStr(),we=new Date(new Date(td+'T12:00:00').getTime()+7*864e5).toISOString().slice(0,10);const up=S.orders.filter(o=>o.status!=='Delivered'&&o.dueDate&&o.dueDate<=we).sort((a,b)=>(a.dueDate||'9').localeCompare(b.dueDate||'9'));if(!up.length){b.innerHTML='';return;}b.innerHTML=`<div class="cm-week-banner"><div class="cm-week-banner-title">🔔 Coming Up <span class="count">${up.length}</span></div><div class="cm-week-items">${up.map(o=>{const d=daysUntil(o.dueDate),sc=STATUS_COLORS[o.status],x=d<0?'overdue':d===0?'today-chip':'',dl=d<0?'Overdue':d===0?'Today':d===1?'Tomorrow':fmtDate(o.dueDate);return`<div class="cm-week-chip ${x}" data-wo="${o.id}"><span class="chip-dot" style="background:${sc.dot}"></span><span class="chip-name">${esc(o.customer)}</span><span class="chip-date">${dl}</span></div>`;}).join('')}</div></div>`;}
document.getElementById('weekBanner').addEventListener('click',e=>{const c=e.target.closest('[data-wo]');if(c){const o=S.orders.find(x=>x.id===c.dataset.wo);if(o)openOrderForm(o);}});

function renderOrders(){const fs=['Active',...STATUS_FLOW,'All'];document.getElementById('orderFilters').innerHTML=fs.map(f=>`<button class="cm-filter-btn ${S.orderFilter===f?'active':''}" data-of="${f}">${f}</button>`).join('');let l=S.orders;if(S.orderFilter==='Active')l=l.filter(o=>o.status!=='Delivered');else if(S.orderFilter!=='All')l=l.filter(o=>o.status===S.orderFilter);if(S.orderSearch){const q=S.orderSearch.toLowerCase();l=l.filter(o=>o.customer.toLowerCase().includes(q)||(o.items||'').toLowerCase().includes(q));}l.sort((a,b)=>{const sa=STATUS_FLOW.indexOf(a.status),sb=STATUS_FLOW.indexOf(b.status);if(sa!==sb)return sa-sb;return(a.dueDate||'9')<(b.dueDate||'9')?-1:1;});if(!l.length){document.getElementById('ordersContent').innerHTML=`<div class="cm-empty"><div class="cm-empty-icon">📋</div><p class="cm-empty-text">No orders found</p><button class="cm-add-btn" style="margin-top:12px" onclick="openFormModal('order',null)">+ Add First Order</button></div>`;return;}document.getElementById('ordersContent').innerHTML='<div class="cm-card-grid">'+l.map(o=>{const d=daysUntil(o.dueDate),sc=STATUS_COLORS[o.status],isD=o.status==='Delivered',urg=isD?'':d<0?'<span class="cm-urgent-badge">OVERDUE</span>':d<=2?'<span class="cm-soon-badge">DUE SOON</span>':'',nx=!isD?STATUS_FLOW[STATUS_FLOW.indexOf(o.status)+1]:'';return`<div class="cm-card cm-order-card" style="border-left-color:${sc.dot}"><div class="cm-order-header"><span class="cm-status-badge" style="background:${sc.bg};color:${sc.text}"><span class="cm-status-dot" style="background:${sc.dot}"></span>${o.status}</span>${urg}</div><h3 class="cm-order-customer">${esc(o.customer)}</h3><p class="cm-order-items">${esc(o.items||'No items')}</p><div class="cm-order-meta"><span class="cm-meta-item">💵 ${fmt$(o.price)}</span>${Number(o.deposit)>0?`<span class="cm-meta-item">🔒 ${fmt$(o.deposit)} dep</span>`:''}<span class="cm-meta-item">📅 ${o.dueDate?fmtDate(o.dueDate):'No date'}</span></div>${o.notes?`<p class="cm-order-notes">📝 ${esc(o.notes)}</p>`:''}${o.photo?`<div class="cm-order-photo"><img class="cm-photo-thumb" src="${o.photo}" data-vp="${o.id}"></div>`:''}<div class="cm-order-actions">${nx?`<button class="cm-advance-btn" data-adv="${o.id}">→ ${nx}</button>`:''}${isD?`<button class="cm-reorder-btn" data-reo="${o.id}">⟳ Reorder</button>`:''}<button class="cm-edit-btn" data-inv="${o.id}">🧾</button><button class="cm-edit-btn" data-eo="${o.id}">Edit</button><button class="cm-delete-btn" data-do="${o.id}">✕</button></div></div>`;}).join('')+'</div>';}
document.getElementById('tab-orders').addEventListener('click',e=>{const af=e.target.closest('[data-of]');if(af){S.orderFilter=af.dataset.of;render();return;}const av=e.target.closest('[data-adv]');if(av){const o=S.orders.find(x=>x.id===av.dataset.adv);if(o){const i=STATUS_FLOW.indexOf(o.status);if(i<3){const wasNotDelivered=o.status!=='Delivered';o.status=STATUS_FLOW[i+1];save('orders');render();if(o.status==='Delivered'&&wasNotDelivered)fireConfetti();}}return;}const ed=e.target.closest('[data-eo]');if(ed){const o=S.orders.find(x=>x.id===ed.dataset.eo);if(o)openOrderForm(o);return;}const iv=e.target.closest('[data-inv]');if(iv){const o=S.orders.find(x=>x.id===iv.dataset.inv);if(o)showInvoice(o);return;}const vp=e.target.closest('[data-vp]');if(vp){const o=S.orders.find(x=>x.id===vp.dataset.vp);if(o&&o.photo)openModal(`<div style="text-align:center"><img class="cm-photo-full" src="${o.photo}"><div class="cm-form-actions" style="margin-top:12px"><button class="cm-cancel-btn" onclick="closeModal()">Close</button></div></div>`);return;}const re=e.target.closest('[data-reo]');if(re){const o=S.orders.find(x=>x.id===re.dataset.reo);if(o)openOrderForm({id:uid(),customer:o.customer,items:o.items,price:o.price,deposit:'',dueDate:'',status:'Pending',notes:o.notes||'',created:todayStr()});return;}const dl=e.target.closest('[data-do]');if(dl){const o=S.orders.find(x=>x.id===dl.dataset.do);if(o)openConfirm(`Delete order for ${o.customer}?`,()=>{S.orders=S.orders.filter(x=>x.id!==o.id);save('orders');render();});}});
document.getElementById('orderSearch').addEventListener('input',e=>{S.orderSearch=e.target.value;render();});

function renderExpenses(){document.getElementById('expCatFilters').innerHTML=['All',...EXPENSE_CATS].map(c=>`<button class="cm-filter-btn ${S.expCatFilter===c?'active':''}" data-ecf="${c}">${c}</button>`).join('');const ms=[...new Set(S.expenses.map(e=>monthKey(e.date)))].sort().reverse();const sel=document.getElementById('expMonthFilter');sel.innerHTML='<option value="All">All Months</option>'+ms.map(m=>`<option value="${m}" ${m===S.expMonthFilter?'selected':''}>${new Date(m+'-15').toLocaleDateString('en-US',{month:'long',year:'numeric'})}</option>`).join('');let l=S.expenses;if(S.expCatFilter!=='All')l=l.filter(e=>e.category===S.expCatFilter);if(S.expMonthFilter!=='All')l=l.filter(e=>monthKey(e.date)===S.expMonthFilter);l.sort((a,b)=>b.date.localeCompare(a.date));const tot=l.reduce((s,e)=>s+Number(e.amount||0),0);document.getElementById('expTotal').innerHTML=`<span style="color:var(--text3)">Total:</span> <strong>${fmt$(tot)}</strong> <span style="color:var(--text4);font-size:14px">(${l.length})</span>`;if(!l.length){document.getElementById('expensesContent').innerHTML=`<div class="cm-empty"><div class="cm-empty-icon">💰</div><p class="cm-empty-text">No expenses</p><button class="cm-add-btn" style="margin-top:12px" onclick="openFormModal('expense',null)">+ Add Expense</button></div>`;return;}document.getElementById('expensesContent').innerHTML=`<div class="cm-table-wrap"><table class="cm-table"><thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Amount</th><th></th></tr></thead><tbody>${l.map(e=>`<tr><td>${fmtDate(e.date)}</td><td>${esc(e.description||'—')}</td><td><span class="cm-cat-pill">${e.category}</span></td><td style="font-weight:600">${fmt$(e.amount)}</td><td style="text-align:right"><button class="cm-edit-sm" data-ee="${e.id}">✏️</button><button class="cm-delete-sm" data-de="${e.id}">✕</button></td></tr>`).join('')}</tbody></table></div>`;}
document.getElementById('tab-expenses').addEventListener('click',e=>{const cf=e.target.closest('[data-ecf]');if(cf){S.expCatFilter=cf.dataset.ecf;render();return;}const ed=e.target.closest('[data-ee]');if(ed){const x=S.expenses.find(i=>i.id===ed.dataset.ee);if(x)openExpenseForm(x);return;}const dl=e.target.closest('[data-de]');if(dl){openConfirm('Delete expense?',()=>{S.expenses=S.expenses.filter(x=>x.id!==dl.dataset.de);save('expenses');render();});}});
document.getElementById('expMonthFilter').addEventListener('change',e=>{S.expMonthFilter=e.target.value;render();});
(function(){document.getElementById('qa-cat').innerHTML=EXPENSE_CATS.map(c=>`<option>${c}</option>`).join('');document.getElementById('qa-cat').value='Supplies';})();
document.getElementById('qa-submit').onclick=qaAdd;document.getElementById('qa-amt').onkeydown=e=>{if(e.key==='Enter')qaAdd();};document.getElementById('qa-desc').onkeydown=e=>{if(e.key==='Enter')document.getElementById('qa-amt').focus();};
function qaAdd(){const d=document.getElementById('qa-desc').value.trim(),a=document.getElementById('qa-amt').value;if(!a||Number(a)<=0)return;S.expenses.unshift({id:uid(),description:d,amount:a,category:document.getElementById('qa-cat').value,date:todayStr()});save('expenses');document.getElementById('qa-desc').value='';document.getElementById('qa-amt').value='';document.getElementById('qa-desc').focus();render();}

function renderDashboard(){const rev=S.orders.filter(o=>o.status==='Delivered').reduce((s,o)=>s+Number(o.price||0),0),tExp=S.expenses.reduce((s,e)=>s+Number(e.amount||0),0),profit=rev-tExp,active=S.orders.filter(o=>o.status!=='Delivered').length,deliv=S.orders.filter(o=>o.status==='Delivered').length,overdue=S.orders.filter(o=>o.status!=='Delivered'&&daysUntil(o.dueDate)<0).length;
  const ins=[];const dtw=S.orders.filter(o=>o.status!=='Delivered'&&o.dueDate&&daysUntil(o.dueDate)>=0&&daysUntil(o.dueDate)<=7).length;if(dtw)ins.push(`📅 <strong>${dtw}</strong> order${dtw>1?'s':''} due this week`);if(overdue)ins.push(`🚨 <strong>${overdue}</strong> overdue`);const mr={};S.orders.filter(o=>o.status==='Delivered').forEach(o=>{const mk=monthKey(o.dueDate||o.created);mr[mk]=(mr[mk]||0)+Number(o.price||0);});const bm=Object.entries(mr).sort((a,b)=>b[1]-a[1])[0];if(bm)ins.push(`🏆 Best: <strong>${new Date(bm[0]+'-15').toLocaleDateString('en-US',{month:'long',year:'numeric'})}</strong> (${fmt$(bm[1])})`);const ebc={};S.expenses.forEach(e=>{ebc[e.category]=(ebc[e.category]||0)+Number(e.amount||0);});const tc=Object.entries(ebc).sort((a,b)=>b[1]-a[1])[0];if(tc)ins.push(`💸 Top expense: <strong>${tc[0]}</strong> ${fmt$(tc[1])}`);const cc={};S.orders.forEach(o=>{cc[o.customer.toLowerCase().trim()]=(cc[o.customer.toLowerCase().trim()]||0)+1;});const rp=Object.values(cc).filter(c=>c>1).length;if(rp)ins.push(`🔄 <strong>${rp}</strong> repeat customer${rp>1?'s':''}`);
  const insH=ins.length?`<div class="cm-insights">${ins.map(i=>`<div class="cm-insight">${i}</div>`).join('')}</div>`:'';
  const monthly={};for(let i=5;i>=0;i--){const d=new Date();d.setMonth(d.getMonth()-i);monthly[d.toISOString().slice(0,7)]={r:0,e:0};}S.orders.filter(o=>o.status==='Delivered').forEach(o=>{const mk=monthKey(o.dueDate||o.created);if(monthly[mk])monthly[mk].r+=Number(o.price||0);});S.expenses.forEach(e=>{const mk=monthKey(e.date);if(monthly[mk])monthly[mk].e+=Number(e.amount||0);});const mxM=Math.max(...Object.values(monthly).map(m=>Math.max(m.r,m.e)),1);const mxE=Math.max(...Object.values(ebc),1);
  const ic={};S.orders.forEach(o=>{if(o.items)o.items.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean).forEach(it=>{ic[it]=(ic[it]||0)+1;});});const ti=Object.entries(ic).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const tO=S.orders.length||1;const piH=STATUS_FLOW.map(s=>{const cn=S.orders.filter(o=>o.status===s).length;if(!cn)return'';return`<div class="cm-pipeline-seg" style="background:${STATUS_COLORS[s].dot};width:${cn/tO*100}%">${cn}</div>`;}).join('');
  const lgH=STATUS_FLOW.map(s=>`<span class="cm-legend-item"><span class="cm-legend-dot" style="background:${STATUS_COLORS[s].dot}"></span>${s} (${S.orders.filter(o=>o.status===s).length})</span>`).join('');
  const chH=Object.entries(monthly).map(([m,d])=>`<div class="cm-chart-col"><div class="cm-chart-bars"><div class="cm-chart-bar" style="background:#8fbc8f;height:${d.r/mxM*100}%;${d.r?'min-height:4px':''}"></div><div class="cm-chart-bar" style="background:var(--accent);height:${d.e/mxM*100}%;${d.e?'min-height:4px':''}"></div></div><span class="cm-chart-label">${new Date(m+'-15').toLocaleDateString('en-US',{month:'short'})}</span></div>`).join('');
  const ebH=Object.keys(ebc).length?'<div class="cm-exp-bar-wrap">'+Object.entries(ebc).sort((a,b)=>b[1]-a[1]).map(([c,a])=>`<div><div class="cm-exp-bar-header"><span>${c}</span><span style="font-weight:600">${fmt$(a)}</span></div><div class="cm-exp-bar-track"><div class="cm-exp-bar-fill" style="width:${a/mxE*100}%"></div></div></div>`).join('')+'</div>':'<p style="color:var(--text4);font-size:14px;text-align:center;margin-top:20px">No expenses yet</p>';
  const tiH=ti.length?`<div class="cm-dash-section"><h3 class="cm-section-title">Most Ordered Items</h3><div class="cm-top-items">${ti.map(([i,c])=>`<span class="cm-top-pill">${esc(i)} <strong>×${c}</strong></span>`).join('')}</div></div>`:'';
  document.getElementById('dashboardContent').innerHTML=`${insH}<div class="cm-stat-grid"><div class="cm-stat-card"><div class="cm-stat-icon">💵</div><p class="cm-stat-label">Revenue</p><p class="cm-stat-value" style="color:var(--green)">${fmt$(rev)}</p><p class="cm-stat-sub">${deliv} delivered</p></div><div class="cm-stat-card"><div class="cm-stat-icon">📦</div><p class="cm-stat-label">Active</p><p class="cm-stat-value" style="color:${overdue?'var(--red)':'var(--accent)'}">${active}</p><p class="cm-stat-sub">${overdue} overdue</p></div><div class="cm-stat-card"><div class="cm-stat-icon">🧾</div><p class="cm-stat-label">Expenses</p><p class="cm-stat-value" style="color:var(--amber)">${fmt$(tExp)}</p><p class="cm-stat-sub">${S.expenses.length} entries</p></div><div class="cm-stat-card"><div class="cm-stat-icon">📈</div><p class="cm-stat-label">Profit</p><p class="cm-stat-value" style="color:${profit>=0?'var(--green)':'var(--red)'}">${fmt$(profit)}</p><p class="cm-stat-sub">${profit>=0?'Looking good!':'Over budget'}</p></div></div><div class="cm-dash-section"><h3 class="cm-section-title">Order Pipeline</h3><div class="cm-pipeline-bar">${piH||'<div style="flex:1;background:var(--border2);border-radius:10px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--text4);font-size:13px">No orders yet</div>'}</div><div class="cm-pipeline-legend">${lgH}</div></div><div class="cm-dash-row"><div class="cm-dash-section"><h3 class="cm-section-title">Monthly Trend</h3><div class="cm-chart-row">${chH}</div><div class="cm-chart-legend"><span class="cm-chart-legend-item"><span class="cm-chart-legend-swatch" style="background:#8fbc8f"></span>Revenue</span><span class="cm-chart-legend-item"><span class="cm-chart-legend-swatch" style="background:var(--accent)"></span>Expenses</span></div></div><div class="cm-dash-section"><h3 class="cm-section-title">Expense Breakdown</h3>${ebH}</div></div>${tiH}`;}

function renderCalendar(){const y=S.calYear,m=S.calMonth,td=todayStr(),mn=new Date(y,m,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});const obd={};S.orders.forEach(o=>{if(o.dueDate){if(!obd[o.dueDate])obd[o.dueDate]=[];obd[o.dueDate].push(o);}});const fd=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate(),dip=new Date(y,m,0).getDate();const cells=[];for(let i=fd-1;i>=0;i--){const d=dip-i,pm=m===0?11:m-1,py=m===0?y-1:y;cells.push({d,ds:`${py}-${String(pm+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,om:true});}for(let d=1;d<=dim;d++){const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;cells.push({d,ds,om:false,t:ds===td});}const rem=7-(cells.length%7);if(rem<7)for(let d=1;d<=rem;d++){const nm=m===11?0:m+1,ny=m===11?y+1:y;cells.push({d,ds:`${ny}-${String(nm+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,om:true});}
  const dH=cells.map(c=>{const os=obd[c.ds]||[];const cls=['cm-cal-day'];if(c.om)cls.push('other-month');if(c.t)cls.push('today');const v=os.slice(0,3),ex=os.length-3;return`<div class="${cls.join(' ')}"><span class="cm-cal-daynum">${c.d}</span><div class="cm-cal-events">${v.map(o=>{const sc=STATUS_COLORS[o.status];return`<div class="cm-cal-event" style="background:${sc.bg};color:${sc.text}" data-ci="${o.id}">${esc(o.customer)}</div>`;}).join('')}${ex>0?`<div class="cm-cal-more" data-cd="${c.ds}">+${ex} more</div>`:''}</div></div>`;}).join('');
  const dwH=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="cm-cal-dow">${d}</div>`).join('');const lH=STATUS_FLOW.map(s=>`<span class="cm-cal-legend-item"><span class="cm-cal-legend-dot" style="background:${STATUS_COLORS[s].dot}"></span>${s}</span>`).join('');const mo=S.orders.filter(o=>o.dueDate&&o.dueDate.startsWith(`${y}-${String(m+1).padStart(2,'0')}`)),moA=mo.filter(o=>o.status!=='Delivered').length,moR=mo.reduce((s,o)=>s+Number(o.price||0),0);
  document.getElementById('calendarContent').innerHTML=`<div class="cm-cal-header"><div><div class="cm-cal-title">${mn}</div><div style="font-size:13px;color:var(--text3);margin-top:2px">${mo.length} orders · ${moA} active · ${fmt$(moR)}</div></div><div class="cm-cal-nav"><button class="cm-cal-today-btn" id="cT">Today</button><button class="cm-cal-nav-btn" id="cP">‹</button><button class="cm-cal-nav-btn" id="cN">›</button></div></div><div class="cm-cal-grid">${dwH}${dH}</div><div class="cm-cal-legend">${lH}</div>`;
  document.getElementById('cP').onclick=()=>{S.calMonth--;if(S.calMonth<0){S.calMonth=11;S.calYear--;}renderCalendar();};document.getElementById('cN').onclick=()=>{S.calMonth++;if(S.calMonth>11){S.calMonth=0;S.calYear++;}renderCalendar();};document.getElementById('cT').onclick=()=>{S.calMonth=new Date().getMonth();S.calYear=new Date().getFullYear();renderCalendar();};}
document.getElementById('tab-calendar').addEventListener('click',e=>{const ex=document.querySelector('.cm-cal-popover');const oe=e.target.closest('[data-ci]');if(oe){const o=S.orders.find(x=>x.id===oe.dataset.ci);if(o)openOrderForm(o);return;}const me=e.target.closest('[data-cd]');if(me){if(ex)ex.remove();const ds=me.dataset.cd,os=S.orders.filter(o=>o.dueDate===ds);if(!os.length)return;const r=me.getBoundingClientRect(),p=document.createElement('div');p.className='cm-cal-popover';p.style.top=Math.min(r.bottom+8,innerHeight-300)+'px';p.style.left=Math.min(r.left,innerWidth-340)+'px';p.innerHTML=`<div class="cm-cal-popover-title">${fmtDate(ds)}</div>${os.map(o=>`<div class="cm-cal-popover-item" data-po="${o.id}"><span style="width:8px;height:8px;border-radius:50%;background:${STATUS_COLORS[o.status].dot};flex-shrink:0"></span><div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:600">${esc(o.customer)}</div><div style="font-size:12px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(o.items||'')}</div></div><span style="font-size:13px;font-weight:600;color:var(--green)">${fmt$(o.price)}</span></div>`).join('')}`;document.body.appendChild(p);p.onclick=pe=>{const it=pe.target.closest('[data-po]');if(it){p.remove();const o=S.orders.find(x=>x.id===it.dataset.po);if(o)openOrderForm(o);}};setTimeout(()=>{const cl=ev=>{if(!p.contains(ev.target)){p.remove();document.removeEventListener('click',cl);}};document.addEventListener('click',cl);},10);return;}if(ex)ex.remove();});

function renderCustomers(){const sb=[{k:'recent',l:'Recent'},{k:'spent',l:'Top Spenders'},{k:'orders',l:'Most Orders'},{k:'name',l:'A-Z'}];document.getElementById('custSortBtns').innerHTML=sb.map(b=>`<button class="cm-filter-btn ${S.custSort===b.k?'active':''}" data-cs="${b.k}">${b.l}</button>`).join('');
  const map={};S.orders.forEach(o=>{const k=o.customer.toLowerCase().trim();if(!map[k])map[k]={name:o.customer,orders:[],total:0,last:''};map[k].orders.push(o);map[k].total+=Number(o.price||0);const d=o.dueDate||o.created||'';if(d>map[k].last)map[k].last=d;});let cs=Object.values(map);
  if(S.custSearch){const q=S.custSearch.toLowerCase();cs=cs.filter(c=>c.name.toLowerCase().includes(q));}
  if(S.custSort==='recent')cs.sort((a,b)=>b.last.localeCompare(a.last));else if(S.custSort==='spent')cs.sort((a,b)=>b.total-a.total);else if(S.custSort==='orders')cs.sort((a,b)=>b.orders.length-a.orders.length);else cs.sort((a,b)=>a.name.localeCompare(b.name));
  if(!cs.length){document.getElementById('customersContent').innerHTML=`<div class="cm-empty"><div class="cm-empty-icon">👥</div><p class="cm-empty-text">${S.custSearch?'No match':'Add orders to see customers here'}</p></div>`;return;}

function handlePhotoUpload(input){const f=input.files[0];if(!f)return;const reader=new FileReader();reader.onload=e=>{const canvas=document.createElement('canvas'),img=new Image();img.onload=()=>{const max=400;let w=img.width,h=img.height;if(w>max){h=h*(max/w);w=max;}if(h>max){w=w*(max/h);h=max;}canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);window._pendingPhoto=canvas.toDataURL('image/jpeg',0.7);let prev=document.getElementById('f-preview');if(!prev){prev=document.createElement('img');prev.id='f-preview';prev.className='cm-photo-thumb';input.parentElement.insertBefore(prev,input.parentElement.firstChild);}prev.src=window._pendingPhoto;};img.src=e.target.result;};reader.readAsDataURL(f);}

function openPriceCalc(){openModal(`<h2 class="cm-form-title">💲 Price Calculator</h2><p style="font-size:13px;color:var(--text3);margin-bottom:16px">Calculate what to charge so you never underprice your work!</p>
  <div class="cm-form-grid"><label class="cm-form-label">Material Cost *<input class="cm-form-input" id="pc-mat" type="number" step="0.01" min="0" placeholder="$0.00" oninput="calcPrice()"></label><label class="cm-form-label">Hours of Work *<input class="cm-form-input" id="pc-hrs" type="number" step="0.5" min="0" placeholder="0" oninput="calcPrice()"></label><label class="cm-form-label">Hourly Rate<input class="cm-form-input" id="pc-rate" type="number" step="0.5" min="0" value="25" placeholder="25" oninput="calcPrice()"></label><label class="cm-form-label">Markup %<input class="cm-form-input" id="pc-markup" type="number" step="5" min="0" value="30" placeholder="30" oninput="calcPrice()"></label></div>
  <div id="pc-result"></div><div class="cm-form-actions"><button class="cm-cancel-btn" onclick="closeModal()">Close</button></div>`);}
function calcPrice(){const mat=Number(document.getElementById('pc-mat').value)||0,hrs=Number(document.getElementById('pc-hrs').value)||0,rate=Number(document.getElementById('pc-rate').value)||25,markup=Number(document.getElementById('pc-markup').value)||0;const labor=hrs*rate,total=(mat+labor)*(1+markup/100);if(mat||hrs)document.getElementById('pc-result').innerHTML=`<div class="cm-calc-result"><div class="cm-calc-price">${fmt$(total)}</div><div style="font-size:13px;color:#065f46;margin-top:4px">Materials ${fmt$(mat)} + Labor ${fmt$(labor)} + ${markup}% markup</div><div style="font-size:12px;color:#065f46;margin-top:4px">Profit: ${fmt$(total-mat)}</div></div>`;else document.getElementById('pc-result').innerHTML='';}

function exportCSV(type){let csv='',fn='';if(type==='orders'){csv='Customer,Items,Price,Deposit,Due Date,Status,Notes,Created\n';S.orders.forEach(o=>{csv+=`"${(o.customer||'').replace(/"/g,'""')}","${(o.items||'').replace(/"/g,'""')}",${o.price||0},${o.deposit||0},${o.dueDate||''},${o.status},"${(o.notes||'').replace(/"/g,'""')}",${o.created||''}\n`;});fn='crafty_mama_orders.csv';}else if(type==='expenses'){csv='Date,Description,Amount,Category\n';S.expenses.forEach(e=>{csv+=`${e.date||''},"${(e.description||'').replace(/"/g,'""')}",${e.amount||0},${e.category||''}\n`;});fn='crafty_mama_expenses.csv';}else if(type==='customers'){const m={};S.orders.forEach(o=>{const k=o.customer.toLowerCase().trim();if(!m[k])m[k]={name:o.customer,orders:0,total:0,last:''};m[k].orders++;m[k].total+=Number(o.price||0);const d=o.dueDate||o.created||'';if(d>m[k].last)m[k].last=d;});csv='Customer,Orders,Total Spent,Last Order\n';Object.values(m).forEach(c=>{csv+=`"${c.name}",${c.orders},${c.total.toFixed(2)},${c.last}\n`;});fn='crafty_mama_customers.csv';}else{csv='Date,Description,Amount,Category,Type\n';S.orders.filter(o=>o.status==='Delivered').forEach(o=>{csv+=`${o.dueDate||o.created||''},"${(o.customer+': '+(o.items||'')).replace(/"/g,'""')}",${o.price||0},Income,Revenue\n`;});S.expenses.forEach(e=>{csv+=`${e.date||''},"${(e.description||'').replace(/"/g,'""')}",-${e.amount||0},${e.category||''},Expense\n`;});fn='crafty_mama_quicken.csv';}const blob=new Blob([csv],{type:'text/csv'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=fn;a.click();URL.revokeObjectURL(url);}
